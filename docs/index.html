<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trust Transaction Monitoring Demo</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef5f8;color:#10232e;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{background:#fff;border:1px solid #d7e2e8;border-radius:8px;box-shadow:0 2px 9px rgba(16,35,46,.10);padding:26px;max-width:620px;line-height:1.5}
    .muted{color:#6b7d88}.err{color:#b72d20}
  </style>
</head>
<body>
  <div class="box" id="status">
    <h1>Loading Trust Transaction Monitoring Demo...</h1>
    <p class="muted">If this stays on screen, refresh the page once.</p>
  </div>
  <script>
    const rawUrl = 'https://raw.githubusercontent.com/srgeerman297/trust-transaction-monitoring/main/index.html?v=' + Date.now();
    fetch(rawUrl)
      .then(r => { if(!r.ok) throw new Error('Could not fetch main demo file: ' + r.status); return r.text(); })
      .then(html => { document.open(); document.write(html); document.close(); })
      .catch(err => {
        document.getElementById('status').innerHTML = '<h1 class="err">Demo could not load</h1><p>' + err.message + '</p><p>Open the repository file directly here: <a href="https://github.com/srgeerman297/trust-transaction-monitoring/blob/main/index.html">index.html on GitHub</a></p>';
      });
  </script>
</body>
</html>
