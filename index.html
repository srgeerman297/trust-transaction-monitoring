<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trust Transaction Monitoring Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="tmApp" src="app.html" title="Trust Transaction Monitoring Demo"></iframe>
<script>
(function(){
  const frame=document.getElementById('tmApp');
  frame.addEventListener('load',function(){
    const doc=frame.contentDocument||frame.contentWindow.document;
    if(!doc||doc.getElementById('statementReviewLoader')) return;
    const script=doc.createElement('script');
    script.id='statementReviewLoader';
    script.src='statement-review.js';
    script.onload=function(){
      if(doc.getElementById('mlcoCasesExtensionLoader')) return;
      const ext=doc.createElement('script');
      ext.id='mlcoCasesExtensionLoader';
      ext.src='mlco-cases-extension.js';
      ext.onload=function(){
        if(doc.getElementById('fiuPdfExtensionLoader')) return;
        const pdf=doc.createElement('script');
        pdf.id='fiuPdfExtensionLoader';
        pdf.src='fiu-pdf-extension.js';
        doc.body.appendChild(pdf);
      };
      doc.body.appendChild(ext);
    };
    doc.body.appendChild(script);
  });
})();
</script>
</body>
</html>
