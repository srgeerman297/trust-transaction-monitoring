function chart(){let vals=S.tx.slice(0,10).reverse().map(t=>Math.min(1300,Math.round(t.amount/1000)));if(vals.length<2)vals=[100,700];let w=760,h=220,p=30,max=1300,pts=vals.map((n,i)=>[p+i*(w-2*p)/(vals.length-1),h-p-(n/max)*(h-2*p)]),path=pts.map((q,i)=>(i?"L":"M")+q[0]+","+q[1]).join(" "),y=h-p-(500/max)*(h-2*p);$("chart").innerHTML=`<svg viewBox="0 0 ${w} ${h}"><line class="threshold" x1="${p}" x2="${w-p}" y1="${y}" y2="${y}"/><path class="series" d="${path}"/>${pts.map((q,i)=>vals[i]>=500?`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#e94755"/>`:"").join("")}<text x="${w-230}" y="${y-8}" fill="#936300">Afl. 500k objective threshold</text></svg>`}
function tables(){let rows=filteredTx();$("live").innerHTML="<thead><tr><th>Time</th><th>Client / company</th><th class='right'>Amount</th><th>Indicators</th><th>Action</th></tr></thead><tbody>"+rows.slice(0,8).map(t=>{let c=clientOf(t.clientId);return`<tr data-open="${t.id}"><td>${t.date.split(" ")[1]}</td><td><b>${c.legal}</b><br><span class="muted">${c.company} · ${t.country}</span></td><td class="right"><b>${money(t.amount)}</b></td><td>${t.indicators.map(pill).join(" ")}</td><td><button class="btn amber" data-flag="${t.id}">Flag</button></td></tr>`}).join("")+"</tbody>";$("txTable").innerHTML="<thead><tr><th>Transaction</th><th>Client</th><th>Type</th><th class='right'>Amount</th><th>Counterparty</th><th>Indicators</th><th>Status</th></tr></thead><tbody>"+rows.map(t=>{let c=clientOf(t.clientId);return`<tr data-open="${t.id}"><td>${t.id}</td><td>${c.legal}<br><span class="muted">${c.company}</span></td><td>${t.type}<br><span class="muted">${t.stage}</span></td><td class="right">${money(t.amount)}</td><td>${t.counterparty}<br><span class="muted">${t.country}</span></td><td>${t.indicators.map(pill).join(" ")}<br><span class="muted">${t.recommendation}</span></td><td>${pill(t.status)}</td></tr>`}).join("")+"</tbody>"}
function scenarioGrid(){$("scenarioGrid").innerHTML=Object.keys(scenarios).map(k=>{let c=clientOf(scenarios[k].clientId);return`<div class="scenario"><h3>${scenarios[k].title}</h3><p class="muted">${c.legal}</p><p class="muted">${scenarios[k].reason}</p><p>${scenarios[k].hint.map(pill).join(" ")}</p><button class="btn primary" data-run="${k}">Run scenario</button></div>`}).join("")}
function engine(){let cse=currentCase(),t=getTx(cse.txId),r=evaluate(t);$("engineAnalysis").innerHTML=Object.keys(indicators).map(code=>`<div class="case"><div>${pill(code)} <b>${indicators[code][0]}</b><br><span class="muted">${indicators[code][1]}</span></div><div>${r.inds.includes(code)?pill("Triggered"):pill("Not triggered")}</div></div>`).join("");$("patternAnalysis").innerHTML=`<div class="row"><span>Primary basis</span><span>${pill(r.primary)}</span></div><div class="row"><span>Recommendation</span><span>${r.rec}</span></div><h4>Detected red flags</h4>${t.red.map(f=>`<div class="check">${f}</div>`).join("")}`}
function cases(){let html=S.cases.map(cse=>{let t=getTx(cse.txId),c=clientOf(cse.clientId);return`<div class="case"><div><h4>${cse.id} · ${c.legal}</h4><p>${t.id} · ${money(t.amount)} · ${t.type}<br>${cse.rationale}</p><p>${cse.indicators.map(pill).join(" ")} ${pill("Due "+cse.deadline)}</p></div><div><button class="btn" data-case="${cse.id}">Open</button><button class="btn blue" data-select="${cse.id}" data-route-to="xml">XML/PDF</button></div></div>`}).join("");$("casesList").innerHTML=html;$("queue").innerHTML=html;let cse=currentCase(),t=getTx(cse.txId),c=clientOf(cse.clientId);$("decision").innerHTML=`<div class="row"><span>Latest case</span><span>${cse.id}</span></div><div class="row"><span>Client</span><span>${c.legal}</span></div><div class="row"><span>Report number</span><span>${reportNo(cse,t)}</span></div><div class="row"><span>Primary basis</span><span>${pill(cse.primary)}</span></div><div class="row"><span>Deadline</span><span>${cse.deadline}</span></div>`}
function prefill(){let cse=currentCase(),c=clientOf(cse.clientId);$("prefillGrid").innerHTML=`<div class="card"><div class="body"><h3>ComplyWhistle client file</h3><div class="row"><span>Client</span><span>${c.legal}</span></div><div class="row"><span>Company</span><span>${c.company}</span></div><div class="row"><span>UBO</span><span>${c.ubo}</span></div><div class="row"><span>Risk</span><span>${pill(c.risk)}</span></div><div class="row"><span>Source of funds</span><span>${c.sof}</span></div></div></div><div class="card"><div class="body"><h3>Shufti screening</h3><div class="row"><span>KYB</span><span>${pill(c.kyb)}</span></div><div class="row"><span>Listed-party screening</span><span>${pill(c.sanctions)}</span></div><div class="row"><span>PEP</span><span>${pill(c.pep)}</span></div></div></div>`}
function rules(){$("indicatorLibrary").innerHTML=Object.keys(indicators).map(k=>`<div class="case"><div>${pill(k)} <b>${indicators[k][0]}</b><br><span class="muted">${indicators[k][1]}</span></div><div>${pill("Active")}</div></div>`).join("");$("redFlagLibrary").innerHTML=flags.map(f=>`<div class="check">${f}</div>`).join("")}
function auditView(){$("auditList").innerHTML=S.audit.map(a=>`<div class="case"><div><b>${a.a}</b><br><span class="muted">${a.time} · ${a.d}</span></div></div>`).join("")||"<div class='body'>No actions logged yet.</div>"}
function data(){let cse=currentCase(),t=getTx(cse.txId),c=clientOf(cse.clientId);return{cse,t,client:c,no:reportNo(cse,t),inds:cse.indicators.map(i=>({code:i,type:indicators[i][0],desc:indicators[i][1]})),subjects:c.subjects}}
function generateXml(){let x=data();S.xml=`<?xml version="1.0" encoding="UTF-8"?>\n<root><metadata><source>Axioma</source><content>FIU_XML.REPORT</content></metadata><data><report_code>${x.no}</report_code><client>${esc(x.client.legal)}</client><description>${esc(x.cse.rationale)}</description><indicator_list>${x.inds.map(i=>`<indicator_row><indicator_code>${i.code}</indicator_code><indicator_description>${esc(i.desc)}</indicator_description></indicator_row>`).join("")}</indicator_list></data></root>`;$("xmlPreview").textContent=S.xml}
function sect(s,first=""){return`<div class="mot-section ${first}">${s}</div>`}function rows(a,g=""){return`<table class="mot-table ${g}">${a.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]||"")}</td></tr>`).join("")}</table>`}function page(h,n,total){return`<div class="mot-page"><div class="mot-title">MELDFORMULIER ONGEBRUIKELIJKE TRANSACTIES</div>${h}<div class="mot-footer">${n} / ${total}</div></div>`}
function subjectRows(subjects){let out=[];subjects.forEach((s,i)=>out.push(["Subject "+(i+1),`${s.first} ${s.last} (${s.role}) ${s.isClient} ${s.country}`]));return out}
function preview(){let x=data(),total=2+x.subjects.length,isObj=!x.inds.some(i=>i.type.includes("Subjectieve")),ir=[["Code",isObj?"Objectieve Indicatoren":"Subjectieve Indicatoren"]].concat(x.inds.map(i=>[i.code,i.desc])),dt=x.t.date.split(" ")[0].split("-"),head='<div class="mot-header"><div class="mot-logo">FIU</div><div class="mot-headtext">Financial Intelligence Unit <i>of</i> Aruba<br><span class="mot-blue">MOT</span></div></div>';let html=page(head+sect("Naam melder","first")+rows([["Handelsnaam:","Axioma"]])+sect("Melding")+rows([["Meldingsnummer:",x.no]])+sect("Toelichting")+rows([[x.cse.rationale,""]])+sect("Indicator")+rows(ir,"mot-gray")+'<div class="mot-blank"></div>',1,total);html+=page(sect("Transactiegegevens","first")+rows([["Client:",x.client.legal],["Aruba company:",x.client.company],["Datum transactie:",`${dt[1]}-${dt[2]}-${dt[0]}`],["Tijd:",x.t.date.split(" ")[1]],["Stadium van transactie:",x.t.stage],["Transactietype:",x.t.type],["Bedrag / valuta:",x.t.amount.toFixed(2)+" AWG"],["Bedrag, gespecificeerd per valutasoort:",""]])+sect("Specificatie transactie")+rows(subjectRows(x.subjects))+'<div class="mot-blank"></div>',2,total);x.subjects.forEach((s,i)=>{html+=page(sect("NATUURLIJKE PERSOON - "+s.short,"first")+rows([[s.role,""]])+sect("Subjectgegevens")+rows([["Eigen naam:",s.last],["Gehuwde naam:",s.married],["Initialen:",s.initials],["Voornamen:",s.first],["Geslacht:",s.gender],["Geboortedatum:",s.birth],["Geboorteplaats:",s.birthCity],["Geboorteland:",s.birthCountry],["Land nationaliteit:",s.nationality]])+sect("Legitimatiegegevens")+rows([["Type:",s.idType],["Nummer:",s.idNumber],["Uitgiftedatum:",s.idIssue],["Vervaldatum:",s.idExpiry],["Plaats van uitgifte:",s.idPlace],["Land van uitgifte:",s.idCountry],["Land nationaliteit:",s.nationality]])+sect("Adresgegevens")+rows([["Straatnaam:",s.street],["Huisnummer:",s.house],["Toevoeging bij huisnummer:",s.addon],["Plaats:",s.city],["Postcode:",s.postcode],["Land:",s.country]])+sect("Telefoongegevens")+rows([["Telefoonnummer:",s.phone]])+sect("Email")+rows([["Email adres:",s.email]]),3+i,total)});$("pdfPreview").innerHTML=html;$("pdfStatus").textContent="MOTWEB-style preview with wrapped text. The downloaded PDF uses dynamic row heights to avoid overlap."}
function generatePackage(show=true){generateXml();preview();if(show)toast("Complete package generated.")}
function downloadXml(){generateXml();let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([S.xml],{type:"application/xml"}));a.download="MOTWEB_"+data().no+".xml";a.click()}
function downloadPdf(){if(!window.jspdf){toast("PDF library still loading. Try again.");return}let x=data(),pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),total=2+x.subjects.length,dt=x.t.date.split(" ")[0].split("-"),ir=[["Code",x.inds.some(i=>i.type.includes("Subjectieve"))?"Subjectieve Indicatoren":"Objectieve Indicatoren"]].concat(x.inds.map(i=>[i.code,i.desc]));function title(){pdf.setFillColor(0,0,0);pdf.rect(4,4,202,9,"F");pdf.setTextColor(255,255,255);pdf.setFontSize(10);pdf.text("MELDFORMULIER ONGEBRUIKELIJKE TRANSACTIES",105,10,{align:"center"});pdf.setTextColor(0,0,0)}function bar(t,y){pdf.setFillColor(0,0,0);pdf.rect(4,y,202,7,"F");pdf.setTextColor(255,255,255);pdf.setFontSize(8.5);pdf.text(t,7,y+4.8);pdf.setTextColor(0,0,0);return y+7}function prow(a,y,g){pdf.setFontSize(8);a.forEach(r=>{let l1=pdf.splitTextToSize(String(r[0]||""),94),l2=pdf.splitTextToSize(String(r[1]||""),94),h=Math.max(l1.length,l2.length)*4.2+4;if(y+h>282){foot("continued");pdf.addPage();y=4}if(g){pdf.setFillColor(220,220,220);pdf.rect(4,y,202,h,"F")}pdf.rect(4,y,101,h);pdf.rect(105,y,101,h);pdf.text(l1,7,y+5);pdf.text(l2,107,y+5);y+=h});return y}function foot(i){pdf.setFontSize(8);pdf.line(4,285,206,285);pdf.text(i+" / "+total,202,291,{align:"right"})}let y=4;title();pdf.rect(4,13,202,40);pdf.setFillColor(35,169,214);pdf.rect(94,13,20,40,"F");pdf.setTextColor(255,255,255);pdf.setFontSize(12);pdf.text("FIU",104,35,{align:"center"});pdf.setTextColor(0,0,0);pdf.setFontSize(11);pdf.text("Financial Intelligence Unit of Aruba",121,31);pdf.setTextColor(0,130,180);pdf.text("MOT",121,38);pdf.setTextColor(0,0,0);y=53;y=bar("Naam melder",y);y=prow([["Handelsnaam:","Axioma"]],y);y=bar("Melding",y+7);y=prow([["Meldingsnummer:",x.no]],y);y=bar("Toelichting",y+9);y=prow([[x.cse.rationale,""]],y);y=bar("Indicator",y+9);y=prow(ir,y,true);foot(1);pdf.addPage();y=4;y=bar("Transactiegegevens",y);y=prow([["Client:",x.client.legal],["Aruba company:",x.client.company],["Datum transactie:",`${dt[1]}-${dt[2]}-${dt[0]}`],["Tijd:",x.t.date.split(" ")[1]],["Stadium van transactie:",x.t.stage],["Transactietype:",x.t.type],["Bedrag / valuta:",x.t.amount.toFixed(2)+" AWG"],["Bedrag, gespecificeerd per valutasoort:",""]],y);y=bar("Specificatie transactie",y+9);y=prow(subjectRows(x.subjects),y);foot(2);x.subjects.forEach((s,i)=>{pdf.addPage();y=4;y=bar("NATUURLIJKE PERSOON - "+s.short,y);y=prow([[s.role,""]],y);y=bar("Subjectgegevens",y);y=prow([["Eigen naam:",s.last],["Gehuwde naam:",s.married],["Initialen:",s.initials],["Voornamen:",s.first],["Geslacht:",s.gender],["Geboortedatum:",s.birth],["Geboorteplaats:",s.birthCity],["Geboorteland:",s.birthCountry],["Land nationaliteit:",s.nationality]],y);y=bar("Legitimatiegegevens",y);y=prow([["Type:",s.idType],["Nummer:",s.idNumber],["Uitgiftedatum:",s.idIssue],["Vervaldatum:",s.idExpiry],["Plaats van uitgifte:",s.idPlace],["Land van uitgifte:",s.idCountry],["Land nationaliteit:",s.nationality]],y);y=bar("Adresgegevens",y);y=prow([["Straatnaam:",s.street],["Huisnummer:",s.house],["Toevoeging bij huisnummer:",s.addon],["Plaats:",s.city],["Postcode:",s.postcode],["Land:",s.country]],y);y=bar("Telefoongegevens",y);y=prow([["Telefoonnummer:",s.phone]],y);y=bar("Email",y);y=prow([["Email adres:",s.email]],y);foot(3+i)});pdf.save("MOTWEB_"+x.no+".pdf");preview()}
function openTx(id){S.selTx=id;let t=getTx(id),cse=S.cases.find(x=>x.txId===id),c=clientOf(t.clientId);$("dtitle").textContent=id+" · "+c.legal;$("dbody").innerHTML=`<div class="notice"><b>${t.recommendation}</b><br>${t.reason}</div><div class="row"><span>Client</span><span>${c.legal}</span></div><div class="row"><span>Amount</span><span>${money(t.amount)}</span></div><div class="row"><span>Indicators</span><span>${t.indicators.map(pill).join(" ")}</span></div><h3>Red flags</h3>${t.red.map(f=>`<div class="check">${f}</div>`).join("")}<h3>MLCO action</h3><button class="btn amber" data-flag="${id}">⚑ Flag transaction</button> <button class="btn primary" data-prepare="${cse.id}">Prepare package</button> <button class="btn blue" data-route-to="xml">XML/PDF</button>`;$("drawer").classList.add("open")}
function openCase(id){S.selCase=id;let cse=S.cases.find(x=>x.id===id),t=getTx(cse.txId),c=clientOf(cse.clientId);$("dtitle").textContent=cse.id+" · MLCO Review";$("dbody").innerHTML=`<div class="notice"><b>${cse.status}</b><br>${cse.rationale}</div><div class="row"><span>Client</span><span>${c.legal}</span></div><div class="row"><span>Primary basis</span><span>${pill(cse.primary)}</span></div><div class="row"><span>Report number</span><span>${reportNo(cse,t)}</span></div><textarea id="drawerRationale">${esc(cse.rationale)}</textarea><br><br><button class="btn" data-save="${cse.id}">Save rationale</button> <button class="btn blue" data-route-to="xml">XML/PDF</button>`;$("drawer").classList.add("open")}
function flagTx(id){let t=getTx(id),cse=S.cases.find(x=>x.txId===id);if(!cse.indicators.includes("130201"))cse.indicators.push("130201");cse.primary="130201";t.indicators=cse.indicators.slice();t.primary="130201";t.recommendation="Subjective reporting recommended after MLCO flag.";render();openCase(cse.id)}function prepare(id){let cse=S.cases.find(x=>x.id===id);cse.status="Draft package prepared";getTx(cse.txId).status="Draft package prepared";S.selCase=id;render();route("xml")}function apiSubmit(){let cse=currentCase();generatePackage(false);cse.status="Reported";getTx(cse.txId).status="Reported";render();toast("Simulated FIU API receipt: FIU-DEMO-"+Date.now().toString().slice(-8))}
function live(){if(S.timer){clearInterval(S.timer);S.timer=null;$("liveBtn").textContent="▶ Live feed";toast("Live feed paused.");return}let keys=Object.keys(scenarios);S.timer=setInterval(()=>{makeTx(keys[Math.floor(Math.random()*keys.length)]);render()},3000);$("liveBtn").textContent="Ⅱ Pause feed";toast("Live feed started.")}
document.addEventListener("click",e=>{let el;if(el=e.target.closest("[data-route]"))route(el.dataset.route);else if(el=e.target.closest("[data-route-to]")){if(el.dataset.select)S.selCase=el.dataset.select;route(el.dataset.routeTo)}else if(el=e.target.closest("[data-open]"))openTx(el.dataset.open);else if(el=e.target.closest("[data-run]")){let t=makeTx(el.dataset.run);render();openTx(t.id)}else if(el=e.target.closest("[data-case]"))openCase(el.dataset.case);else if(el=e.target.closest("[data-flag]"))flagTx(el.dataset.flag);else if(el=e.target.closest("[data-prepare]"))prepare(el.dataset.prepare);else if(el=e.target.closest("[data-save]")){currentCase().rationale=$("drawerRationale").value;render();toast("Rationale saved.")}});
$("closeDrawer").onclick=()=>$("drawer").classList.remove("open");$("liveBtn").onclick=live;$("autoBtn").onclick=()=>{let t=makeTx("wire");render();openTx(t.id)};$("flagBtn").onclick=()=>flagTx(S.selTx||S.tx[0].id);$("pkgBtn").onclick=()=>prepare(currentCase().id);$("q").onkeydown=e=>{if(e.key==="Enter")route("transactions")};$("clientFilter").onchange=render;$("statusFilter").onchange=render;$("genPackageBtn").onclick=()=>generatePackage(true);$("downloadXmlBtn").onclick=downloadXml;$("downloadPdfBtn").onclick=downloadPdf;$("apiBtn").onclick=apiSubmit;
["wire","near","cash","list","police","proxy","tf"].forEach(makeTx);render();generatePackage(false);route("dashboard");
})();
</script></body></html>
