function renderGraph(){let svg=$('txGraph');if(!svg)return;let data=S.tx.slice(0,28).reverse();if(data.length<2)return;let w=1000,h=310,padL=46,padR=26,padT=42,padB=36,vals=data.map(t=>t.amount),max=Math.max(900000,...vals),min=0,range=max-min,step=(w-padL-padR)/(data.length-1);let pts=data.map((t,i)=>{let x=padL+i*step,y=padT+(1-(t.amount-min)/range)*(h-padT-padB);return{x,y,t}});let line=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');let area=line+` L ${pts[pts.length-1].x} ${h-padB} L ${pts[0].x} ${h-padB} Z`;let thresholdY=padT+(1-(500000-min)/range)*(h-padT-padB);let grid=[0,250000,500000,750000,1000000].map(v=>{let y=padT+(1-(v-min)/range)*(h-padT-padB);return`<line class='chart-axis' x1='${padL}' x2='${w-padR}' y1='${y}' y2='${y}'/><text class='chart-label' x='8' y='${y+4}'>${v>=1000000?'1M':v/1000+'k'}</text>`}).join('');let dots=pts.map(p=>p.t.amount>=500000?`<circle class='chart-dot' cx='${p.x}' cy='${p.y}' r='5'/>`:'').join('');let last=pts[pts.length-1],lastTx=last.t;svg.innerHTML=`<defs><linearGradient id='activityGradient' x1='0' x2='0' y1='0' y2='1'><stop offset='0%' stop-color='#47d7ff' stop-opacity='.34'/><stop offset='100%' stop-color='#47d7ff' stop-opacity='0'/></linearGradient></defs>${grid}<line class='chart-threshold' x1='${padL}' x2='${w-padR}' y1='${thresholdY}' y2='${thresholdY}'/><text class='chart-label' x='${w-230}' y='${thresholdY-8}'>Afl. 500k objective threshold</text><path class='chart-area' d='${area}'/><path class='chart-line' d='${line}'/>${dots}<circle class='chart-last' cx='${last.x}' cy='${last.y}' r='7'/><text class='chart-label' x='${Math.max(padL,last.x-170)}' y='${Math.max(25,last.y-16)}'>${lastTx.id} · ${short(lastTx.amount)} AWG</text>`;$('chartMeta').innerHTML=`<span class='chart-chip'><strong>${data.length}</strong> points</span><span class='chart-chip'>Max <strong>${short(Math.max(...vals))}</strong> AWG</span><span class='chart-chip'>Latest <strong>${short(lastTx.amount)}</strong> AWG</span>`;$ function render(){let r=rows();$('kTx').textContent=S.tx.length;$('kInd').textContent=S.tx.reduce((a,t)=>a+t.ind.length,0);$('kCase').textContent=S.cases.filter(c=>c.status!='Reported').length;$('live').innerHTML='<thead><tr><th>Time</th><th>Client</th><th class="right">Amount</th><th>Indicators</th><th>Action</th></tr></thead><tbody>'+r.slice(0,8).map(t=>{let c=C(t.clientId);return`<tr data-open='${t.id}'><td>${t.date.split(' ')[1]}</td><td><b>${c.legal}</b><br><span class='muted'>${c.company}</span></td><td class='right'><b>${money(t.amount)}</b></td><td>${t.ind.map(P).join(' ')}</td><td><button class='btn amber' data-flag='${t.id}'>Flag</button></td></tr>`}).join('')+'</tbody>';$('txTable').innerHTML='<thead><tr><th>Transaction</th><th>Client</th><th>Type</th><th class="right">Amount</th><th>Counterparty</th><th>Indicators</th><th>Status</th></tr></thead><tbody>'+r.map(t=>{let c=C(t.clientId);return`<tr data-open='${t.id}'><td>${t.id}</td><td>${c.legal}</td><td>${t.type}</td><td class='right'>${money(t.amount)}</td><td>${t.counterparty}<br><span class='muted'>${t.country}</span></td><td>${t.ind.map(P).join(' ')}</td><td>${P(t.status)}</td></tr>`}).join('')+'</tbody>';$('scenarioGrid').innerHTML=Object.keys(scen).map(k=>`<div class='scenario'><h3>${scen[k][0]}</h3><p class='muted'>${C(scen[k][1]).legal}</p><p>${scen[k][6].map(P).join(' ')}</p><button class='btn primary' data-run='${k}'>Run scenario</button></div>`).join('');$('engineAnalysis').innerHTML=Object.keys(indicatorInfo).map(k=>`<div class='case'><div>${P(k)} <b>${indicatorInfo[k]}</b></div><div>${P('Active')}</div></div>`).join('');$('patternAnalysis').innerHTML=flags.map(f=>`<div class='check'>${esc(f)}</div>`).join('');let h=S.cases.map(c=>{let t=TX(c.txId),cl=C(c.clientId);return`<div class='case'><div><h4>${c.id} · ${cl.legal}</h4><p>${t.id} · ${money(t.amount)} · ${t.type}<br>${c.rationale}</p><p>${c.ind.map(P).join(' ')} ${P('Due '+c.deadline)}</p></div><div><button class='btn' data-case='${c.id}'>Open</button><button class='btn blue' data-select='${c.id}' data-route-to='xml'>XML/PDF</button></div></div>`}).join('');$('queue').innerHTML=h;$('casesList').innerHTML=h;let c=cur(),t=TX(c.txId),cl=C(c.clientId);$('decision').innerHTML=`<div class='row'><span>Case</span><span>${c.id}</span></div><div class='row'><span>Client</span><span>${cl.legal}</span></div><div class='row'><span>Status</span><span>${P(c.status)}</span></div>`;$('prefillGrid').innerHTML=`<div class='card'><div class='body'><h3>ComplyWhistle client file</h3><div class='row'><span>Client</span><span>${cl.legal}</span></div><div class='row'><span>UBO</span><span>${cl.ubo}</span></div><div class='row'><span>Risk</span><span>${P(cl.risk)}</span></div></div></div><div class='card'><div class='body'><h3>Shufti screening</h3><div class='row'><span>KYB</span><span>${P('Verified')}</span></div><div class='row'><span>Screening</span><span>${P(cl.screening)}</span></div></div></div>`;$('indicatorLibrary').innerHTML=$('engineAnalysis').innerHTML;$('redFlagLibrary').innerHTML=flags.map(f=>`<div class='check'>${esc(f)}</div>`).join('');$('customRules').innerHTML=S.rules.length?S.rules.map((r,i)=>`<div class='case'><div><h4>${esc(r.name)}</h4><p>${P(r.ind)} ${esc(r.label)}</p><p><b>Trigger:</b> ${esc(r.trigger)}</p><p class='muted'>${esc(r.notes)}</p></div><button class='btn amber' data-delrule='${i}'>Remove</button></div>`).join(''):'<span class="muted">No custom rules added yet.</span>';$('auditList').innerHTML=S.audit.map(a=>`<div class='case'><div><b>${a.a}</b><br><span class='muted'>${a.time} · ${a.d}</span></div></div>`).join('');renderGraph()}
function data(){let c=cur(),t=TX(c.txId),cl=C(c.clientId);return{c,t,cl,no:reportNo(c,t),subjects:cl.subjects,inds:c.ind.map(code=>({code,desc:indicatorInfo[code]}))}}
function sec(s,first=''){return`<div class='mbar ${first}'>${esc(s)}</div>`}function mrows(a,gray=''){return`<table class='mtab ${gray}'>${a.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]||'')}</td></tr>`).join('')}</table>`}function mpage(h,n,total){return`<div class='motpage'><div class='mtitle'>MELDFORMULIER ONGEBRUIKELIJKE TRANSACTIES</div>${h}<div class='mfooter'>${n} / ${total}</div></div>`}
function pdfPreviewHtml(){let x=data(),total=2+x.subjects.length,obj=!x.c.ind.some(i=>i=='130201'||i=='130202'),head=`<div class='mhead'><div class='fiu'>FIU</div><div class='mheadtext'>Financial Intelligence Unit of Aruba<br><span class='motblue'>MOT</span></div></div>`;let p1=mpage(head+sec('Naam melder','first')+mrows([['Handelsnaam:','Axioma']])+sec('Melding')+mrows([['Meldingsnummer:',x.no]])+sec('Toelichting')+mrows([[x.c.rationale,'']])+sec('Indicator')+mrows([['Code',obj?'Objectieve Indicatoren':'Subjectieve Indicatoren']].concat(x.inds.map(i=>[i.code,i.desc])),'mgray')+`<div class='mblank'></div>`,1,total);let d=x.t.date.split(' ')[0].split('-');let p2=mpage(sec('Transactiegegevens','first')+mrows([['Client:',x.cl.legal],['Aruba company:',x.cl.company],['Datum transactie:',`${d[1]}-${d[2]}-${d[0]}`],['Tijd:',x.t.date.split(' ')[1]],['Stadium van transactie:',x.t.stage],['Transactietype:',x.t.type],['Bedrag / valuta:',x.t.amount.toFixed(2)+' AWG'],['Bedrag, gespecificeerd per valutasoort:','']])+sec('Specificatie transactie')+mrows(x.subjects.map((s,i)=>['Subject '+(i+1),`${s.first} ${s.last} (${s.role}) ${s.isClient} ${s.country}`]))+`<div class='mblank'></div>`,2,total);let ps=x.subjects.map((s,i)=>mpage(sec('NATUURLIJKE PERSOON - '+s.short,'first')+mrows([[s.role,'']])+sec('Subjectgegevens')+mrows([['Eigen naam:',s.last],['Gehuwde naam:',s.married],['Initialen:',s.initials],['Voornamen:',s.first],['Geslacht:',s.gender],['Geboortedatum:',s.birth],['Geboorteplaats:',s.birthCity],['Geboorteland:',s.birthCountry],['Land nationaliteit:',s.nationality]])+sec('Legitimatiegegevens')+mrows([['Type:',s.idType],['Nummer:',s.idNumber],['Uitgiftedatum:',s.idIssue],['Vervaldatum:',s.idExpiry],['Plaats van uitgifte:',s.idPlace],['Land van uitgifte:',s.idCountry],['Land nationaliteit:',s.nationality]])+sec('Adresgegevens')+mrows([['Straatnaam:',s.street],['Huisnummer:',s.house],['Toevoeging bij huisnummer:',s.addon],['Plaats:',s.city],['Postcode:',s.postcode],['Land:',s.country]])+sec('Telefoongegevens')+mrows([['Telefoonnummer:',s.phone]])+sec('Email')+mrows([['Email adres:',s.email]]),3+i,total)).join('');return p1+p2+ps}
function gen(show=true){let x=data();S.xml=`<?xml version="1.0"?><root><case>${x.c.id}</case><client>${esc(x.cl.legal)}</client><transaction>${x.t.id}</transaction><amount>${x.t.amount}</amount><indicators>${x.t.ind.join(',')}</indicators></root>`;$('xmlPreview').textContent=S.xml;$('pdfPreview').innerHTML=pdfPreviewHtml();$('pdfStatus').textContent='Preview generated from the selected MLCO case.';if(show)toast('Complete package generated.')}function downloadXml(){gen(false);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([S.xml],{type:'application/xml'}));a.download='FIU-demo.xml';a.click()}
function downloadPdf(){if(!window.jspdf){toast('PDF library still loading.');return}let x=data(),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),total=2+x.subjects.length;function title(){pdf.setFillColor(0,0,0);pdf.rect(4,4,202,9,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(10);pdf.text('MELDFORMULIER ONGEBRUIKELIJKE TRANSACTIES',105,10,{align:'center'});pdf.setTextColor(0,0,0)}function bar(t,y){pdf.setFillColor(0,0,0);pdf.rect(4,y,202,7,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(8.5);pdf.text(t,7,y+4.8);pdf.setTextColor(0,0,0);return y+7}function prow(a,y,g){pdf.setFontSize(8);a.forEach(r=>{let l1=pdf.splitTextToSize(String(r[0]||''),94),l2=pdf.splitTextToSize(String(r[1]||''),94),h=Math.max(l1.length,l2.length)*4.2+4;if(y+h>282){pdf.addPage();y=4}if(g){pdf.setFillColor(220,220,220);pdf.rect(4,y,202,h,'F')}pdf.rect(4,y,101,h);pdf.rect(105,y,101,h);pdf.text(l1,7,y+5);pdf.text(l2,107,y+5);y+=h});return y}function foot(i){pdf.setFontSize(8);pdf.line(4,285,206,285);pdf.text(i+' / '+total,202,291,{align:'right'})}function head(){title();pdf.rect(4,13,202,40);pdf.setFillColor(35,169,214);pdf.rect(94,13,20,40,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(12);pdf.text('FIU',104,35,{align:'center'});pdf.setTextColor(0,0,0);pdf.setFontSize(11);pdf.text('Financial Intelligence Unit of Aruba',121,31);pdf.setTextColor(0,130,180);pdf.text('MOT',121,38);pdf.setTextColor(0,0,0)}let obj=!x.c.ind.some(i=>i=='130201'||i=='130202'),dt=x.t.date.split(' ')[0].split('-'),y=53;head();y=bar('Naam melder',y);y=prow([['Handelsnaam:','Axioma']],y);y=bar('Melding',y+7);y=prow([['Meldingsnummer:',x.no]],y);y=bar('Toelichting',y+9);y=prow([[x.c.rationale,'']],y);y=bar('Indicator',y+9);y=prow([['Code',obj?'Objectieve Indicatoren':'Subjectieve Indicatoren']].concat(x.inds.map(i=>[i.code,i.desc])),y,true);foot(1);pdf.addPage();y=4;y=bar('Transactiegegevens',y);y=prow([['Client:',x.cl.legal],['Aruba company:',x.cl.company],['Datum transactie:',`${dt[1]}-${dt[2]}-${dt[0]}`],['Tijd:',x.t.date.split(' ')[1]],['Stadium van transactie:',x.t.stage],['Transactietype:',x.t.type],['Bedrag / valuta:',x.t.amount.toFixed(2)+' AWG'],['Bedrag, gespecificeerd per valutasoort:','']],y);y=bar('Specificatie transactie',y+9);y=prow(x.subjects.map((s,i)=>['Subject '+(i+1),`${s.first} ${s.last} (${s.role}) ${s.isClient} ${s.country}`]),y);foot(2);x.subjects.forEach((s,i)=>{pdf.addPage();y=4;y=bar('NATUURLIJKE PERSOON - '+s.short,y);y=prow([[s.role,'']],y);y=bar('Subjectgegevens',y);y=prow([['Eigen naam:',s.last],['Gehuwde naam:',s.married],['Initialen:',s.initials],['Voornamen:',s.first],['Geslacht:',s.gender],['Geboortedatum:',s.birth],['Geboorteplaats:',s.birthCity],['Geboorteland:',s.birthCountry],['Land nationaliteit:',s.nationality]],y);y=bar('Legitimatiegegevens',y);y=prow([['Type:',s.idType],['Nummer:',s.idNumber],['Uitgiftedatum:',s.idIssue],['Vervaldatum:',s.idExpiry],['Plaats van uitgifte:',s.idPlace],['Land van uitgifte:',s.idCountry],['Land nationaliteit:',s.nationality]],y);y=bar('Adresgegevens',y);y=prow([['Straatnaam:',s.street],['Huisnummer:',s.house],['Toevoeging bij huisnummer:',s.addon],['Plaats:',s.city],['Postcode:',s.postcode],['Land:',s.country]],y);y=bar('Telefoongegevens',y);y=prow([['Telefoonnummer:',s.phone]],y);y=bar('Email',y);y=prow([['Email adres:',s.email]],y);foot(3+i)});pdf.save('MOTWEB_'+x.no+'.pdf')}
function openTx(id){S.sel=S.cases.find(c=>c.txId==id).id;let t=TX(id),cl=C(t.clientId);$('dtitle').textContent=id+' · '+cl.legal;$('dbody').innerHTML=`<div class='notice'><b>${t.ind.map(P).join(' ')}</b><br>${t.counterparty} · ${money(t.amount)}</div><button class='btn primary' data-prepare='${S.sel}'>Prepare package</button> <button class='btn blue' data-route-to='xml'>XML/PDF</button>`;$('drawer').classList.add('open')}function prepare(id){let c=S.cases.find(x=>x.id==id);c.status='Draft package prepared';TX(c.txId).status='Draft package prepared';S.sel=id;route('xml')}function addRule(){let sel=$('ruleIndicator'),label=sel.options[sel.selectedIndex].text;S.rules.unshift({name:$('ruleName').value,ind:sel.value,label,trigger:$('ruleTrigger').value,notes:$('ruleNotes').value});S.audit.unshift({a:'Custom rule added',d:$('ruleName').value+' · '+label,time:new Date().toLocaleString()});render();toast('Custom monitoring rule added.')}function live(){if(S.timer){clearInterval(S.timer);S.timer=null;$('liveBtn').textContent='▶ Live feed';return}let k=Object.keys(scen);S.timer=setInterval(()=>{make(k[Math.floor(Math.random()*k.length)]);render()},1800);$('liveBtn').textContent='Ⅱ Pause feed';toast('Live feed started.')}
document.addEventListener('click',e=>{let x;if(x=e.target.closest('[data-route]'))route(x.dataset.route);else if(x=e.target.closest('[data-route-to]')){if(x.dataset.select)S.sel=x.dataset.select;route(x.dataset.routeTo)}else if(x=e.target.closest('[data-open]'))openTx(x.dataset.open);else if(x=e.target.closest('[data-run]')){let t=make(x.dataset.run);render();openTx(t.id)}else if(x=e.target.closest('[data-case]')){S.sel=x.dataset.case;route('cases')}else if(x=e.target.closest('[data-flag]'))openTx(x.dataset.flag);else if(x=e.target.closest('[data-prepare]'))prepare(x.dataset.prepare);else if(x=e.target.closest('[data-delrule]')){S.rules.splice(+x.dataset.delrule,1);render()}});$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('liveBtn').onclick=live;$('autoBtn').onclick=()=>{let t=make('wire');render();openTx(t.id)};$('flagBtn').onclick=()=>openTx(S.tx[0].id);$('pkgBtn').onclick=()=>prepare(cur().id);$('q').onkeydown=e=>{if(e.key=='Enter')route('transactions')};$('clientFilter').onchange=render;$('statusFilter').onchange=render;$('genPackageBtn').onclick=()=>gen(true);$('downloadXmlBtn').onclick=downloadXml;$('downloadPdfBtn').onclick=downloadPdf;$('apiBtn').onclick=()=>{cur().status='Reported';TX(cur().txId).status='Reported';render();toast('Simulated FIU API receipt created.')};$('addRuleBtn').onclick=addRule;['wire','near','cash','list','police','proxy','tf'].forEach(make);render();gen(false);route('dashboard');})();
