<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Trust Transaction Monitoring</title><script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'></script><style>body{margin:0;background:#eef5f8;color:#10232e;font-family:Arial,sans-serif;overflow:hidden}.app{display:grid;grid-template-columns:250px 1fr;height:100vh}.side{background:#05232c;color:#d8e4e8}.logo{background:#ff563e;color:white;font-size:28px;font-weight:800;padding:18px 22px}.logo small{display:block;font-size:11px}.nav button{display:block;width:100%;height:54px;border:0;border-left:4px solid transparent;background:transparent;color:#d8e4e8;text-align:left;padding-left:22px;font-size:15px;cursor:pointer}.nav button.active{background:#11313d;color:white;border-left-color:#7bd2ff}.note{position:fixed;bottom:0;width:250px;background:#031b22;padding:14px;font-size:12px}.top{height:72px;background:white;border-bottom:1px solid #dce7ed;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top input{width:560px;height:40px;border:1px solid #ccd9df;border-radius:6px;padding:0 12px}.content{height:calc(100vh - 72px);overflow:auto;padding:18px 32px 45px}.toolbar,.group{display:flex;gap:8px;flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:16px}.btn,select,input,textarea{border:1px solid #ccd9df;border-radius:6px;background:white;padding:0 12px;font:inherit}.btn,select,input{height:38px}.btn{font-weight:700;cursor:pointer}.primary{background:#082d38!important;color:white}.red{background:#fff0f2;color:#b72d38}.green{background:#eafaf2;color:#087a47}.blue{background:#eaf6ff;color:#0f679d}.amber{background:#fff6e4;color:#8c5f04}.purple{background:#f2edff;color:#4b2cb0}.view{display:none}.view.active{display:block}.notice{border-left:4px solid #e94755;background:#fff1f2;padding:13px 15px;margin-bottom:16px}.grid{display:grid;gap:16px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card,.kpi,.scenario{background:white;border:1px solid #dfe8ed;border-radius:8px;box-shadow:0 3px 12px #0001;overflow:hidden}.head{padding:14px 18px;border-bottom:1px solid #dce7ed;font-size:18px;font-weight:750}.body,.kpi,.scenario{padding:16px}.kpi .label{font-size:12px;color:#667b86;text-transform:uppercase}.kpi .num{font-size:28px;font-weight:850}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;margin:1px;font-size:11px;font-weight:750}.p-red{background:#ffe8e9;color:#bc2a35}.p-green{background:#e6f7ef;color:#067343}.p-amber{background:#fff5df;color:#936300}.p-purple{background:#f2edff;color:#4b2cb0}.p-gray{background:#edf2f5;color:#5c6b73}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #e1eaee;padding:10px;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;background:#f6fafc;color:#71828c}.right{text-align:right!important}.muted{color:#667b86}.case{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px;border-bottom:1px solid #e4ecef}.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #edf2f5}.check{margin:8px 0}.check:before{content:'✓';background:#e6f7ef;color:#087a47;border-radius:50%;font-weight:bold;padding:2px 6px;margin-right:8px}.drawer{position:fixed;right:-640px;top:0;width:620px;height:100vh;background:white;box-shadow:-12px 0 30px #0003;z-index:20;transition:.2s}.drawer.open{right:0}.dhead{height:72px;border-bottom:1px solid #dce7ed;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.dbody{padding:20px;overflow:auto}.x{border:0;background:#eef3f6;border-radius:50%;width:40px;height:40px;font-size:22px}.toast{position:fixed;right:20px;bottom:20px;background:#082d38;color:white;padding:14px;border-radius:6px;display:none}.toast.show{display:block}.xmlbox{font-family:monospace;white-space:pre-wrap;background:#0b1720;color:#d6f7ff;border-radius:8px;padding:14px;max-height:330px;overflow:auto}.preview{background:#e9eef2;border:1px solid #d0dbe2;border-radius:8px;padding:18px;max-height:620px;overflow:auto}.paper{width:760px;min-height:900px;background:white;margin:auto;border:1px solid #aaa;padding:14px}.blk{background:#000;color:#fff;padding:7px 10px;font-weight:bold}.form{width:100%;border-collapse:collapse;table-layout:fixed}.form td{border:1px solid #000;padding:6px;overflow-wrap:anywhere}.form td:first-child{width:45%}</style></head><body><div class='app'><aside class='side'><div class='logo'>Fraugster<small>TRUST TM ADD-ON</small></div><div id='nav' class='nav'></div><div class='note'>Fictional demo data only. No real FIU submission is performed from this page.</div></aside><main><header class='top'><input id='q' placeholder='Search transaction, client, company, UBO, country, indicator'><button class='btn blue' data-route='scenarios'>Run scenario</button></header><section class='content'><div class='toolbar'><div class='group'><select id='clientFilter'><option value='all'>All trust clients</option></select><select id='statusFilter'><option value='all'>All statuses</option><option>Awaiting MLCO review</option><option>Draft package prepared</option><option>Reported</option></select><button class='btn green' id='liveBtn'>▶ Live feed</button></div><div class='group'><button class='btn red' id='autoBtn'>⚠ Afl. 500k+ trigger</button><button class='btn purple' data-route='scenarios'>◆ Scenario</button><button class='btn amber' id='flagBtn'>⚑ MLCO flag</button><button class='btn primary' id='pkgBtn'>▶ Prepare package</button></div></div><div id='views'></div></section></main></div><aside class='drawer' id='drawer'><div class='dhead'><h3 id='dtitle'>Details</h3><button class='x' id='closeDrawer'>×</button></div><div class='dbody' id='dbody'></div></aside><div class='toast' id='toast'></div><script>(()=>{const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' AWG',esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const ind={130101:'Police / justice report',130102:'Listed-party hit',130103:'Giro Afl. 500k+',130104:'Cash Afl. 25k+',130105:'Casino cash Afl. 5k+',130201:'Subjective ML review',130202:'Subjective TF/PF review'};const clients=[['C1','Blue Harbor Foundation VBA','Blue Harbor Operations VBA','R.M. Croes'],['C2','Sunset Holdings N.V.','Sunset Management VBA','J.A. Tromp'],['C3','Coral Private Trust','Coral Property Management VBA','E. Kelly'],['C4','Caya Investment Ltd','Caya Investment Aruba VBA','L. Maduro'],['C5','Meridian Family Office Foundation','Meridian Corporate Services VBA','N.S. Peters']].map(x=>({id:x[0],legal:x[1],company:x[2],ubo:x[3],risk:x[0]=='C2'?'Medium':'High',subjects:[{first:x[3],last:x[3].split(' ').pop(),role:'Opdrachtgever',country:'Aruba',id:'P'+Math.floor(100000+Math.random()*899999)}]}));const flags=['Missing agreement','Unclear UBO/signatory link','Unusual geography','Proxy withdrawal chain','Near-threshold pattern','Counterparty mismatch'];const scen={wire:['High-value giro + missing agreement','C1','Giraal',742500,'Panama','Isthmus Capital SA',['130103','130201'],[flags[0],flags[1],flags[2]]],list:['Listed-party screening hit','C5','Giraal',86000,'Listed route','Listed Marine Trading Ltd',['130102','130202'],[flags[2],flags[5]]],police:['Police / justice request','C2','Giraal',125000,'Aruba','Local Holding NV',['130101'],['Police / justice request']],cash:['Cash funding above Afl. 25k','C3','Contant',36000,'Aruba','Client cash deposit',['130104'],['Cash profile mismatch']],near:['Repeated near-threshold transfers','C3','Giraal',499950,'Aruba','Palm Advisory VBA',['130201'],[flags[4]]],proxy:['Proxy withdrawal chain','C4','Giraal',310000,'Aruba','Proxy Services VBA',['130201'],[flags[3]]],tf:['Possible TF/PF concern','C5','Giraal',28000,'High-risk route','Relief Procurement Group',['130202'],[flags[2],flags[5]]]};const S={tx:[],cases:[],audit:[],sel:null,timer:null,rules:[],xml:''};$('nav').innerHTML=['dashboard','scenarios','engine','transactions','cases','prefill','xml','rules','audit'].map(v=>`<button data-route='${v}'>${{dashboard:'◔ Dashboard',scenarios:'◆ Scenarios',engine:'▥ Indicator Engine',transactions:'↔ Transactions',cases:'▣ MLCO Cases',prefill:'▥ CW/Shufti Prefill',xml:'▤ XML / PDF',rules:'＋ Rules & Red Flags',audit:'☷ Audit Trail'}[v]}</button>`).join('');$('clientFilter').innerHTML+='<option value="all">All trust clients</option>'+clients.map(c=>`<option value='${c.id}'>${c.legal}</option>`).join('');$('views').innerHTML=`<div id='dashboard' class='view active'><div class='notice'><b>Trust-firm transaction monitoring demo:</b> fictional live transactions feed MLCO review and FIU package preparation.</div><div class='grid four'><div class='kpi'><div class='label'>Transactions</div><div class='num' id='kTx'></div></div><div class='kpi'><div class='label'>Indicators</div><div class='num' id='kInd'></div></div><div class='kpi'><div class='label'>MLCO queue</div><div class='num' id='kCase'></div></div><div class='kpi'><div class='label'>Clients</div><div class='num'>5</div></div></div><br><div class='grid two'><div class='card'><div class='head'>Live transaction feed</div><div class='body' style='padding:0'><table class='table' id='live'></table></div></div><div class='card'><div class='head'>Open MLCO cases</div><div id='queue'></div></div></div></div><div id='scenarios' class='view'><h1>Scenario Library</h1><div class='grid three' id='scenarioGrid'></div></div><div id='engine' class='view'><h1>Indicator Engine</h1><div class='grid two'><div class='card'><div class='head'>Indicator library</div><div class='body' id='engineAnalysis'></div></div><div class='card'><div class='head'>Red flags</div><div class='body' id='patternAnalysis'></div></div></div></div><div id='transactions' class='view'><h1>Transactions</h1><div class='card'><div class='head'>Transaction list</div><div class='body' style='padding:0'><table class='table' id='txTable'></table></div></div></div><div id='cases' class='view'><h1>MLCO Cases</h1><div class='grid two'><div class='card'><div class='head'>Case queue</div><div id='casesList'></div></div><div class='card'><div class='head'>Decision support</div><div class='body' id='decision'></div></div></div></div><div id='prefill' class='view'><h1>ComplyWhistle / Shufti Prefill</h1><div class='grid two' id='prefillGrid'></div></div><div id='xml' class='view'><h1>XML / PDF / FIU API Package</h1><div class='notice'><b>No upload required:</b> XML and PDF are generated from the selected MLCO case.</div><div class='grid two'><div class='card'><div class='head'>FIU XML</div><div class='body'><button class='btn primary' id='genPackageBtn'>Generate full package</button> <button class='btn' id='downloadXmlBtn'>Download XML</button> <button class='btn green' id='downloadPdfBtn'>Download PDF</button> <button class='btn amber' id='apiBtn'>Simulate FIU API submit</button><br><br><div class='xmlbox' id='xmlPreview'></div></div></div><div class='card'><div class='head'>PDF preview</div><div class='body'><div id='pdfStatus' class='notice'>Preview generated from the selected MLCO case.</div><div class='preview' id='pdfPreview'></div></div></div></div></div><div id='rules' class='view'><h1>Rules & Red Flags</h1><div class='grid two'><div class='card'><div class='head'>Indicator library</div><div class='body' id='indicatorLibrary'></div></div><div class='card'><div class='head'>Trust-firm red flags</div><div class='body' id='redFlagLibrary'></div></div><div class='card'><div class='head'>Add monitoring rule</div><div class='body'><input id='ruleName' style='width:100%;margin-bottom:8px' value='New custom monitoring rule'><select id='ruleIndicator' style='width:100%;margin-bottom:8px'><option>130201</option><option>130202</option><option>130103</option><option>130104</option></select><input id='ruleTrigger' style='width:100%;margin-bottom:8px' value='3 related transactions within 7 days'><textarea id='ruleNotes' style='width:100%;height:76px;padding:10px;margin-bottom:8px'>Review connected transactions by time, counterparty, object and modus operandi.</textarea><button class='btn primary' id='addRuleBtn'>Add rule</button></div></div><div class='card'><div class='head'>Custom rules</div><div class='body' id='customRules'></div></div></div></div><div id='audit' class='view'><h1>Audit Trail</h1><div class='card'><div class='head'>Action log</div><div id='auditList'></div></div></div>`;function C(id){return clients.find(c=>c.id==id)}function P(x){x=String(x);let c=x=='130201'||x=='130202'?'purple':x.startsWith('13010')?'red':x.includes('Awaiting')||x.includes('Draft')?'amber':x.includes('Reported')?'green':'gray';return`<span class='pill p-${c}'>${esc(x)}</span>`}function make(k){let s=scen[k],t={id:'TX-'+Math.floor(100000+Math.random()*899999),clientId:s[1],type:s[2],amount:s[3],country:s[4],counterparty:s[5],ind:s[6],red:s[7],status:'Awaiting MLCO review',date:'2026-05-24 10:'+String(10+S.tx.length).padStart(2,'0')};S.tx.unshift(t);let c={id:'CASE-'+Math.floor(10000+Math.random()*89999),txId:t.id,clientId:t.clientId,status:t.status,ind:t.ind,deadline:'2026-05-29',rationale:(t.ind.includes('130201')||t.ind.includes('130202')?'Subjective review recommended. ':'Objective trigger detected. ')+s[0]};S.cases.unshift(c);S.sel=c.id;S.audit.unshift({time:new Date().toLocaleString(),a:'Scenario executed',d:s[0]});return t}function TX(id){return S.tx.find(t=>t.id==id)}function cur(){return S.cases.find(c=>c.id==S.sel)||S.cases[0]}function rows(){let cf=$('clientFilter').value,sf=$('statusFilter').value,q=$('q').value.toLowerCase();return S.tx.filter(t=>{let c=C(t.clientId),s=[t.id,c.legal,c.company,t.country,t.counterparty,t.status,t.ind.join(' ')].join(' ').toLowerCase();return(cf=='all'||t.clientId==cf)&&(sf=='all'||t.status==sf)&&(!q||s.includes(q))})}function route(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route==v));render();if(v=='xml')gen(false)}function render(){let r=rows();$('kTx').textContent=S.tx.length;$('kInd').textContent=S.tx.reduce((a,t)=>a+t.ind.length,0);$('kCase').textContent=S.cases.filter(c=>c.status!='Reported').length;$('live').innerHTML='<thead><tr><th>Time</th><th>Client</th><th class=right>Amount</th><th>Indicators</th><th>Action</th></tr></thead><tbody>'+r.slice(0,8).map(t=>{let c=C(t.clientId);return`<tr data-open='${t.id}'><td>${t.date.split(' ')[1]}</td><td><b>${c.legal}</b><br><span class=muted>${c.company}</span></td><td class=right><b>${money(t.amount)}</b></td><td>${t.ind.map(P).join(' ')}</td><td><button class='btn amber' data-flag='${t.id}'>Flag</button></td></tr>`}).join('')+'</tbody>';$('txTable').innerHTML='<thead><tr><th>Transaction</th><th>Client</th><th>Type</th><th class=right>Amount</th><th>Counterparty</th><th>Indicators</th><th>Status</th></tr></thead><tbody>'+r.map(t=>{let c=C(t.clientId);return`<tr data-open='${t.id}'><td>${t.id}</td><td>${c.legal}</td><td>${t.type}</td><td class=right>${money(t.amount)}</td><td>${t.counterparty}<br><span class=muted>${t.country}</span></td><td>${t.ind.map(P).join(' ')}</td><td>${P(t.status)}</td></tr>`}).join('')+'</tbody>';$('scenarioGrid').innerHTML=Object.keys(scen).map(k=>`<div class=scenario><h3>${scen[k][0]}</h3><p class=muted>${C(scen[k][1]).legal}</p><p>${scen[k][6].map(P).join(' ')}</p><button class='btn primary' data-run='${k}'>Run scenario</button></div>`).join('');$('engineAnalysis').innerHTML=Object.keys(ind).map(k=>`<div class=case><div>${P(k)} <b>${ind[k]}</b></div><div>${P('Active')}</div></div>`).join('');$('patternAnalysis').innerHTML=flags.map(f=>`<div class=check>${f}</div>`).join('');let h=S.cases.map(c=>{let t=TX(c.txId),cl=C(c.clientId);return`<div class=case><div><h4>${c.id} · ${cl.legal}</h4><p>${t.id} · ${money(t.amount)} · ${t.type}<br>${c.rationale}</p><p>${c.ind.map(P).join(' ')} ${P('Due '+c.deadline)}</p></div><div><button class=btn data-case='${c.id}'>Open</button><button class='btn blue' data-select='${c.id}' data-route-to=xml>XML/PDF</button></div></div>`}).join('');$('queue').innerHTML=h;$('casesList').innerHTML=h;let c=cur(),t=TX(c.txId),cl=C(c.clientId);$('decision').innerHTML=`<div class=row><span>Case</span><span>${c.id}</span></div><div class=row><span>Client</span><span>${cl.legal}</span></div><div class=row><span>Status</span><span>${P(c.status)}</span></div>`;$('prefillGrid').innerHTML=`<div class=card><div class=body><h3>ComplyWhistle client file</h3><div class=row><span>Client</span><span>${cl.legal}</span></div><div class=row><span>UBO</span><span>${cl.ubo}</span></div><div class=row><span>Risk</span><span>${P(cl.risk)}</span></div></div></div><div class=card><div class=body><h3>Shufti screening</h3><div class=row><span>KYB</span><span>${P('Verified')}</span></div><div class=row><span>Screening</span><span>${P(cl.sanctions||'No match')}</span></div></div></div>`;$('indicatorLibrary').innerHTML=$('engineAnalysis').innerHTML;$('redFlagLibrary').innerHTML=flags.map(f=>`<div class=check>${f}</div>`).join('');$('customRules').innerHTML=S.rules.length?S.rules.map((r,i)=>`<div class=case><div><h4>${esc(r.name)}</h4><p>${P(r.ind)} ${esc(r.trigger)}</p><p class=muted>${esc(r.notes)}</p></div><button class='btn amber' data-delrule='${i}'>Remove</button></div>`).join(''):'<span class=muted>No custom rules added yet.</span>';$('auditList').innerHTML=S.audit.map(a=>`<div class=case><div><b>${a.a}</b><br><span class=muted>${a.time} · ${a.d}</span></div></div>`).join('')}function paper(){let c=cur(),t=TX(c.txId),cl=C(c.clientId);return`<div class=paper><div class=blk>MELDFORMULIER ONGEBRUIKELIJKE TRANSACTIES</div><br><table class=form><tr><td>Handelsnaam:</td><td>Axioma</td></tr><tr><td>Meldingsnummer:</td><td>${c.id}</td></tr><tr><td>Client:</td><td>${cl.legal}</td></tr><tr><td>Transactietype:</td><td>${t.type}</td></tr><tr><td>Bedrag / valuta:</td><td>${money(t.amount)}</td></tr><tr><td>Indicatoren:</td><td>${t.ind.join(', ')}</td></tr><tr><td>Specificatie transactie:</td><td>${cl.subjects.map((s,i)=>'Subject '+(i+1)+': '+s.first+' '+s.last+' ('+s.role+')').join('; ')}</td></tr></table></div>`}function gen(show=true){let c=cur(),t=TX(c.txId),cl=C(c.clientId);S.xml=`<?xml version="1.0"?><root><case>${c.id}</case><client>${esc(cl.legal)}</client><transaction>${t.id}</transaction><amount>${t.amount}</amount><indicators>${t.ind.join(',')}</indicators></root>`;$('xmlPreview').textContent=S.xml;$('pdfPreview').innerHTML=paper();$('pdfStatus').textContent='Preview generated from the selected MLCO case.';if(show)toast('Complete package generated.')}function downloadXml(){gen(false);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([S.xml],{type:'application/xml'}));a.download='FIU-demo.xml';a.click()}function downloadPdf(){if(!window.jspdf){toast('PDF library still loading.');return}let c=cur(),t=TX(c.txId),cl=C(c.clientId),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});pdf.setFontSize(12);pdf.text('MELDFORMULIER ONGEBRUIKELIJKE TRANSACTIES',105,12,{align:'center'});let y=25;[['Handelsnaam','Axioma'],['Meldingsnummer',c.id],['Client',cl.legal],['Transactietype',t.type],['Bedrag / valuta',money(t.amount)],['Indicatoren',t.ind.join(', ')],['Specificatie transactie',cl.subjects.map((s,i)=>'Subject '+(i+1)+': '+s.first+' '+s.last+' ('+s.role+')').join('; ')]].forEach(r=>{let l1=pdf.splitTextToSize(r[0],55),l2=pdf.splitTextToSize(r[1],115),h=Math.max(l1.length,l2.length)*5+4;pdf.rect(15,y,60,h);pdf.rect(75,y,120,h);pdf.text(l1,18,y+6);pdf.text(l2,78,y+6);y+=h});pdf.save('FIU-demo.pdf')}function openTx(id){S.sel=S.cases.find(c=>c.txId==id).id;let t=TX(id),cl=C(t.clientId);$('dtitle').textContent=id+' · '+cl.legal;$('dbody').innerHTML=`<div class=notice><b>${t.ind.map(P).join(' ')}</b><br>${t.counterparty} · ${money(t.amount)}</div><button class='btn primary' data-prepare='${S.sel}'>Prepare package</button> <button class='btn blue' data-route-to=xml>XML/PDF</button>`;$('drawer').classList.add('open')}function prepare(id){let c=S.cases.find(x=>x.id==id);c.status='Draft package prepared';TX(c.txId).status='Draft package prepared';S.sel=id;route('xml')}function addRule(){S.rules.unshift({name:$('ruleName').value,ind:$('ruleIndicator').value,trigger:$('ruleTrigger').value,notes:$('ruleNotes').value});S.audit.unshift({a:'Custom rule added',d:$('ruleName').value,time:new Date().toLocaleString()});render();toast('Custom monitoring rule added.')}function live(){if(S.timer){clearInterval(S.timer);S.timer=null;$('liveBtn').textContent='▶ Live feed';return}let k=Object.keys(scen);S.timer=setInterval(()=>{make(k[Math.floor(Math.random()*k.length)]);render()},2500);$('liveBtn').textContent='Ⅱ Pause feed';toast('Live feed started.')}document.addEventListener('click',e=>{let x;if(x=e.target.closest('[data-route]'))route(x.dataset.route);else if(x=e.target.closest('[data-route-to]')){if(x.dataset.select)S.sel=x.dataset.select;route(x.dataset.routeTo)}else if(x=e.target.closest('[data-open]'))openTx(x.dataset.open);else if(x=e.target.closest('[data-run]')){let t=make(x.dataset.run);render();openTx(t.id)}else if(x=e.target.closest('[data-case]')){S.sel=x.dataset.case;route('cases')}else if(x=e.target.closest('[data-flag]'))openTx(x.dataset.flag);else if(x=e.target.closest('[data-prepare]'))prepare(x.dataset.prepare);else if(x=e.target.closest('[data-delrule]')){S.rules.splice(+x.dataset.delrule,1);render()}});$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('liveBtn').onclick=live;$('autoBtn').onclick=()=>{let t=make('wire');render();openTx(t.id)};$('flagBtn').onclick=()=>openTx(S.tx[0].id);$('pkgBtn').onclick=()=>prepare(cur().id);$('q').onkeydown=e=>{if(e.key=='Enter')route('transactions')};$('clientFilter').onchange=render;$('statusFilter').onchange=render;$('genPackageBtn').onclick=()=>gen(true);$('downloadXmlBtn').onclick=downloadXml;$('downloadPdfBtn').onclick=downloadPdf;$('apiBtn').onclick=()=>{cur().status='Reported';TX(cur().txId).status='Reported';render();toast('Simulated FIU API receipt created.')};$('addRuleBtn').onclick=addRule;['wire','near','cash','list','police','proxy','tf'].forEach(make);render();gen(false);route('dashboard');})();</script></body></html>
